{% extends "base.html" %}
{% block title %}Profile — RetinaScan{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block content %}
<div class="profile-card">
  <div class="profile-header">
    <div class="avatar-ring large">{{ user['name'][0] | upper }}</div>
    <div>
      <h2>{{ user['name'] }}</h2>
      <p>{{ user['email'] }}</p>
    </div>
  </div>

  <form method="POST" action="{{ url_for('profile') }}" class="profile-form">
    <div class="form-grid-2">
      <div>
        <label>Full name</label>
        <input type="text" name="name" value="{{ user['name'] }}">
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone" value="{{ user['phone'] or '' }}">
      </div>
    </div>

    <div class="form-grid-2">
      <div>
        <label>Gender</label>
        <select name="gender">
          {% for g in ['Female', 'Male', 'Other', 'Prefer not to say'] %}
          <option value="{{ g }}" {% if user['gender'] == g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Blood group</label>
        <input type="text" name="blood_group" value="{{ user['blood_group'] or '' }}" placeholder="e.g. O+">
      </div>
    </div>

    <label>Existing conditions</label>
    <textarea name="existing_conditions" rows="3" placeholder="e.g. Type 2 diabetes, diagnosed 2019">{{ user['existing_conditions'] or '' }}</textarea>

    <label>Emergency contact</label>
    <input type="text" name="emergency_contact" value="{{ user['emergency_contact'] or '' }}" placeholder="Name and phone number">

    <button type="submit" class="btn btn-primary">Save changes</button>
  </form>
</div>
{% endblock %}
